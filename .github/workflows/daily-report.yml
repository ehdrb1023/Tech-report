name: Daily AI Trend Report

on:
  schedule:
    # UTC 22:45 = KST 07:45 (다음날). 아침 8시 도착을 목표로 한다.
    #   러너 혼잡도에 따라 5~15분 지연 + 파이프라인 실행에 약 8분이 걸리므로
    #   07:45 에 트리거하면 대략 07:55~08:10 사이에 Discord 로 도착한다.
    - cron: "45 22 * * *"

  # 수동 실행 (Actions 탭 → Run workflow)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Discord로 보내지 않고 로그에만 출력"
        type: boolean
        default: false
      hours:
        description: "수집 기간(시간)"
        type: string
        default: "24"

# 이전 실행이 남아 있으면 취소하고 최신 것만 실행
concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    # Reddit RSS 는 429 재시도 때문에 서브레딧 10개에 5~7분이 걸린다
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 중복 보도 기록(state/seen.json)과 X 계정 ID 캐시를 실행 간에 이어붙인다.
      # 캐시가 없어도 동작에는 지장이 없다 — 중복 억제가 안 될 뿐.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: trend-state-${{ github.run_id }}
          restore-keys: |
            trend-state-

      - name: Run pipeline
        env:
          # 추가 채널은 DISCORD_WEBHOOK_URL_EXTRA 에 넣는다 (비어 있으면 무시)
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }},${{ secrets.DISCORD_WEBHOOK_URL_EXTRA }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          LOOKBACK_HOURS: ${{ inputs.hours || '24' }}
          TIMEZONE: Asia/Seoul
          REPORT_LANGUAGE: ko
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m src.main --dry-run --verbose
          else
            python -m src.main --verbose
          fi

      # 전송 성공 여부와 무관하게 저장 (dry-run 은 기록을 남기지 않음)
      - name: Save state
        if: always() && inputs.dry_run != true
        uses: actions/cache/save@v4
        with:
          path: state
          key: trend-state-${{ github.run_id }}
